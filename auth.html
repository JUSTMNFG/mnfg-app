<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MNfG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:sans-serif;background:#f2f2f2;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:white;padding:25px;border-radius:15px;width:100%;max-width:350px;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
h2{text-align:center}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:12px;background:black;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin-top:10px}
button.signup{background:#007bff}
.link{text-align:center;color:blue;margin-top:15px;cursor:pointer;font-size:14px}
#msg{text-align:center;margin-top:10px;font-size:14px;min-height:20px}
#otpBox{display:none}
</style>
</head>
<body>
<div class="box">
<h2>MNfG Login</h2>

<div id="authBox">
<input type="email" id="email" placeholder="ইমেইল দাও">
<input type="password" id="password" placeholder="পাসওয়ার্ড দাও (৬+ অক্ষর)">
<button onclick="doLogin()">Login করো</button>
<button class="signup" onclick="doSignup()">নতুন একাউন্ট খুলো</button>
</div>

<div id="otpBox">
<p style="text-align:center">তোমার ইমেইলে ৬ সংখ্যার OTP গেছে, ঐটা দাও</p>
<input type="text" id="otp" placeholder="OTP কোড দাও" maxlength="6" inputmode="numeric">
<button onclick="verifyOtp()">OTP দিয়া কনফার্ম করো</button>
<div class="link" onclick="backToLogin()">পিছনে যাও</div>
</div>

<div id="msg"></div>
</div>

<script>
const supabaseUrl = "https://ujhjloihskutkazhaydc.supabase.co";
const supabaseKey = "sb_publishable_EqE3D3fqYSf5C13Ds0wNyQ_ZeDHoJfH";
let supabaseClient = null;
try{ supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey); }catch(e){}

async function doSignup(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  if(!email.includes('@')){ msg.innerText='সঠিক ইমেইল দাও'; msg.style.color='red'; return; }
  if(password.length < 6){ msg.innerText='পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দাও'; msg.style.color='red'; return; }
  msg.innerText='OTP পাঠাইতেছি...'; msg.style.color='black';
  const { error } = await supabaseClient.auth.signUp({ email, password });
  if(error){ msg.innerText = error.message; msg.style.color='red'; }
  else{
    msg.innerText='OTP পাঠানো হইছে! ইমেইল চেক করো'; msg.style.color='green';
    document.getElementById('authBox').style.display='none';
    document.getElementById('otpBox').style.display='block';
  }
}

async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  if(!email.includes('@') || password.length < 6){ msg.innerText='ইমেইল আর পাসওয়ার্ড ঠিক কইরা দাও'; msg.style.color='red'; return; }
  msg.innerText='Login হইতেছে...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ msg.innerText='Login হয় নাই! আগে OTP দিয়া কনফার্ম করছো?'; msg.style.color='red'; }
  else{ window.location.href='index.html'; }
}

async function verifyOtp(){
  const email = document.getElementById('email').value.trim();
  const token = document.getElementById('otp').value.trim();
  const msg = document.getElementById('msg');
  if(token.length < 6){ msg.innerText='৬ সংখ্যার OTP দাও'; msg.style.color='red'; return; }
  const { error } = await supabaseClient.auth.verifyOtp({ email, token, type:'signup' });
  if(error){ msg.innerText='OTP ভুল! আবার চেক করো'; msg.style.color='red'; }
  else{
    msg.innerText='হইছে! এখন Login করো'; msg.style.color='green';
    backToLogin();
  }
}

function backToLogin(){
  document.getElementById('otpBox').style.display='none';
  document.getElementById('authBox').style.display='block';
}
</script>
</body>
</html>
