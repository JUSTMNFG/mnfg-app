<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - Bondhu Apps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{
  background:#e8c8e8;
  display:flex;
  justify-content:center;
  min-height:100vh;
  transition:background 0.25s ease;
}
body.dark-body{background:#090312}

.phone{
  width:100%;
  max-width:400px;
  background:linear-gradient(180deg,#2d0a5e 0%,#7b2a9e 40%,#c94b8a 70%,#f07ba8 100%);
  padding:20px 18px 28px;
  min-height:100vh;
  position:relative;
  transition:background 0.25s ease;
}
.phone.dark-mode{
  background:linear-gradient(180deg,#0c041a 0%,#1a0936 45%,#28104a 100%);
}

.top{display:flex;align-items:center;gap:12px;color:white;margin-bottom:20px}
.top a{color:white;text-decoration:none;font-size:30px;padding:0 6px;line-height:1}
.top h1{font-size:25px;flex:1}
.logo{
  width:48px;height:48px;background:#f0e0ff;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:900;color:#7b2a9e;flex-shrink:0;
}
.phone.dark-mode .logo{background:#24143d;color:#e2b6ff}

.profile-card,.box{
  background:white;
  border-radius:20px;
  padding:20px 18px;
  margin-bottom:14px;
  box-shadow:0 8px 20px rgba(0,0,0,0.16);
  transition:background 0.2s,color 0.2s;
}
.phone.dark-mode .profile-card,
.phone.dark-mode .box{
  background:#1b112b;
  color:#ffffff;
  border:1px solid rgba(255,255,255,0.08);
}

.avatar-wrap{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}

.avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  background:linear-gradient(135deg,#7b2a9e,#e040a8);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  overflow:hidden;
  flex-shrink:0;
  border:2px solid rgba(123,42,158,0.25);
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.small-btn{
  border:none;
  border-radius:10px;
  padding:8px 12px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  background:#efe2ff;
  color:#3b0d69;
}
.phone.dark-mode .small-btn{
  background:#2d1c47;
  color:#f0e2ff;
}

.profile-card h2{
  color:#1a0a2e;
  font-size:22px;
  word-break:break-word;
}
.phone.dark-mode .profile-card h2{color:#ffffff}

.box h3{color:#1a0a2e;font-size:18px;margin-bottom:10px}
.phone.dark-mode .box h3{color:#ffffff}

.box input{
  width:100%;padding:12px;border:1.5px solid #ddd;border-radius:12px;
  font-size:15px;margin-bottom:10px;outline:none;background:#fff;color:#1a0a2e;
}
.phone.dark-mode .box input{
  background:#281940;color:#ffffff;border-color:#3f2a61;
}
.box input:focus{border-color:#7b2a9e}

.btn{
  width:100%;padding:12px;border:none;border-radius:12px;
  background:linear-gradient(90deg,#4b0082,#c94b8a);
  color:white;font-size:15px;font-weight:bold;cursor:pointer;
  margin-bottom:8px;
}
.btn:last-child{margin-bottom:0}
.btn:disabled{opacity:0.6;cursor:not-allowed}

.btn-secondary{
  width:100%;padding:11px;border:1.5px solid #7b2a9e;border-radius:12px;
  background:transparent;color:#4b0082;font-size:14px;font-weight:bold;cursor:pointer;
  margin-bottom:8px;
}
.phone.dark-mode .btn-secondary{
  color:#e5c8ff;border-color:#9e5ce0;
}

.otp-step{
  display:none;
  margin-top:8px;
  padding-top:10px;
  border-top:1px dashed rgba(123,42,158,0.25);
}

.msg{font-size:13px;margin-top:8px;font-weight:bold;min-height:18px;word-break:break-word}
.msg-ok{color:#1b8a3e}
.msg-err{color:#d92638}
.phone.dark-mode .msg-ok{color:#69f094}
.phone.dark-mode .msg-err{color:#ff8a95}

.back{
  background:white;color:#1a0a2e;text-align:center;padding:14px;
  border-radius:12px;font-weight:bold;margin-top:10px;cursor:pointer;
}
.phone.dark-mode .back{
  background:#24143d;color:#ffffff;border:1px solid rgba(255,255,255,0.12);
}
.ver{text-align:center;color:rgba(255,255,255,0.85);font-size:12px;margin-top:18px}
</style>
</head>
<body>

<div class="phone" id="phoneFrame">
  <div class="top">
    <a href="home.html">‹</a>
    <h1 id="pTitle">Profile</h1>
    <div class="logo">B</div>
  </div>

  <div class="profile-card">
    <div class="avatar-wrap">
      <div class="avatar" id="avatarCircle">M</div>
      <div class="photo-actions">
        <button type="button" class="small-btn" id="uploadPhotoBtn" onclick="document.getElementById('photoInput').click()">📷 Profile Picture</button>
        <button type="button" class="small-btn" id="resetPhotoBtn" onclick="clearCustomPhoto()">M</button>
        <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
      </div>
    </div>
    <h2 id="profileName">Loading...</h2>
    <div class="msg" id="photoMsg"></div>
  </div>

  <div class="box">
    <h3 id="nameBoxTitle">✏️ Change Name</h3>
    <input type="text" id="nameInput" placeholder="Enter your new name">
    <button class="btn" id="nameBtn" onclick="saveName()">Save Name</button>
    <div class="msg" id="nameMsg"></div>
  </div>

  <div class="box">
    <h3 id="resetBoxTitle">🔐 Reset Password (OTP)</h3>
    <button class="btn-secondary" id="sendOtpBtn" onclick="sendResetOtp()">Send Reset OTP</button>

    <div class="otp-step" id="otpResetSection">
      <input type="text" id="resetOtpInput" maxlength="6" inputmode="numeric" placeholder="6-digit OTP">
      <input type="password" id="newPassInput" placeholder="New password (6+ characters)">
      <button class="btn" id="confirmResetBtn" onclick="verifyOtpAndResetPassword()">Verify OTP & Reset Password</button>
    </div>

    <div class="msg" id="passMsg"></div>
  </div>

  <div class="back" id="backHomeBtn" onclick="location.href='home.html'">Back to Home</div>
  <div class="ver">Bondhu Apps • Version 1.1 Trial</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ujhjloihskutkazhaydc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_EqE3D3fqYSf5C13Ds0wNyQ_ZeDHoJfH";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const PHOTO_STORAGE_PREFIX = "bondhu_profile_photo_";
  let activeUser = null;

  const texts = {
    'বাংলা': {
      title: 'প্রোফাইল',
      uploadPhoto: '📷 প্রোফাইল ছবি',
      nameTitle: '✏️ নাম পরিবর্তন করুন',
      namePh: 'আপনার নতুন নাম লিখুন',
      nameBtn: 'নাম সেভ করুন',
      emptyName: 'দয়া করে একটি নাম লিখুন।',
      savingName: 'সেভ হচ্ছে...',
      nameSaved: 'নাম সফলভাবে সেভ হয়েছে!',
      resetTitle: '🔐 পাসওয়ার্ড রিসেট (OTP)',
      sendOtp: 'রিসেট OTP পাঠান',
      otpPh: '৬ সংখ্যার OTP',
      newPassPh: 'নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)',
      confirmReset: 'OTP যাচাই ও পাসওয়ার্ড রিসেট করুন',
      sendingOtp: 'OTP পাঠানো হচ্ছে...',
      otpSent: 'আপনার ইমেইলে রিসেট OTP পাঠানো হয়েছে।',
      invalidOtp: 'সঠিক ৬ সংখ্যার OTP দিন।',
      shortPass: 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।',
      resettingPass: 'পাসওয়ার্ড রিসেট হচ্ছে...',
      passResetOk: 'OTP যাচাই হয়ে পাসওয়ার্ড রিসেট হয়েছে!',
      photoSaved: 'প্রোফাইল ছবি সেভ হয়েছে!',
      photoCleared: 'ডিফল্ট অক্ষর (M) ফিরিয়ে আনা হয়েছে।',
      back: 'হোমে ফিরে যান',
      errPrefix: 'ত্রুটি: '
    },
    'English': {
      title: 'Profile',
      uploadPhoto: '📷 Profile Picture',
      nameTitle: '✏️ Change Name',
      namePh: 'Enter your new name',
      nameBtn: 'Save Name',
      emptyName: 'Please enter a name.',
      savingName: 'Saving...',
      nameSaved: 'Name saved successfully!',
      resetTitle: '🔐 Reset Password (OTP)',
      sendOtp: 'Send Reset OTP',
      otpPh: '6-digit OTP',
      newPassPh: 'New password (6+ characters)',
      confirmReset: 'Verify OTP & Reset Password',
      sendingOtp: 'Sending OTP...',
      otpSent: 'Reset OTP has been sent to your email.',
      invalidOtp: 'Enter a valid 6-digit OTP.',
      shortPass: 'Password must be at least 6 characters.',
      resettingPass: 'Resetting password...',
      passResetOk: 'OTP verified & password reset successfully!',
      photoSaved: 'Profile picture saved!',
      photoCleared: 'Default letter avatar restored.',
      back: 'Back to Home',
      errPrefix: 'Error: '
    },
    'Hindi': {
      title: 'प्रोफ़ाइल',
      uploadPhoto: '📷 प्रोफ़ाइल फ़ोटो',
      nameTitle: '✏️ नाम बदलें',
      namePh: 'अपना नया नाम लिखें',
      nameBtn: 'नाम सेव करें',
      emptyName: 'कृपया एक नाम लिखें।',
      savingName: 'सेव हो रहा है...',
      nameSaved: 'नाम सफलतापूर्वक सेव हो गया!',
      resetTitle: '🔐 पासवर्ड रीसेट (OTP)',
      sendOtp: 'रीसेट OTP भेजें',
      otpPh: '6 अंकों का OTP',
      newPassPh: 'नया पासवर्ड (कम से कम 6 अक्षर)',
      confirmReset: 'OTP सत्यापित करें और पासवर्ड रीसेट करें',
      sendingOtp: 'OTP भेजा जा रहा है...',
      otpSent: 'आपके ईमेल पर रीसेट OTP भेजा गया है।',
      invalidOtp: 'सही 6 अंकों का OTP दर्ज करें।',
      shortPass: 'पासवर्ड कम से कम 6 अक्षरों का होना चाहिए।',
      resettingPass: 'पासवर्ड रीसेट हो रहा है...',
      passResetOk: 'OTP सत्यापित हुआ और पासवर्ड रीसेट हो गया!',
      photoSaved: 'प्रोफ़ाइल फ़ोटो सेव हो गई!',
      photoCleared: 'डिफ़ॉल्ट अक्षर अवतार बहाल किया गया।',
      back: 'होम पर वापस जाएं',
      errPrefix: 'त्रुटि: '
    }
  };

  function getLangPack() {
    const lang = localStorage.getItem('bondhu_lang') || 'বাংলা';
    return texts[lang] || texts['বাংলা'];
  }

  function setMsg(el, text, type) {
    el.className = 'msg ' + (type === 'ok' ? 'msg-ok' : type === 'err' ? 'msg-err' : '');
    el.textContent = text;
  }

  function getPhotoStorageKey(user) {
    return PHOTO_STORAGE_PREFIX + (user?.id || 'default');
  }

  function renderAvatar(name) {
    const circle = document.getElementById('avatarCircle');
    const savedPhoto = activeUser ? localStorage.getItem(getPhotoStorageKey(activeUser)) : null;

    if (savedPhoto) {
      circle.innerHTML = `<img src="${savedPhoto}" alt="Profile">`;
    } else {
      const initial = (name || 'M').trim().charAt(0).toUpperCase() || 'M';
      circle.textContent = initial;
    }
  }

  function handlePhotoUpload(event) {
    const file = event.target.files?.[0];
    if (!file || !activeUser) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        localStorage.setItem(getPhotoStorageKey(activeUser), reader.result);
        renderAvatar(document.getElementById('profileName').textContent);
        setMsg(document.getElementById('photoMsg'), getLangPack().photoSaved, 'ok');
      } catch (e) {
        setMsg(document.getElementById('photoMsg'), getLangPack().errPrefix + e.message, 'err');
      }
    };
    reader.readAsDataURL(file);
  }

  function clearCustomPhoto() {
    if (!activeUser) return;
    localStorage.removeItem(getPhotoStorageKey(activeUser));
    renderAvatar(document.getElementById('profileName').textContent);
    setMsg(document.getElementById('photoMsg'), getLangPack().photoCleared, 'ok');
  }

  function applyPreferences() {
    const isDark = localStorage.getItem('bondhu_darkMode') === 'true';
    document.getElementById('phoneFrame').classList.toggle('dark-mode', isDark);
    document.body.classList.toggle('dark-body', isDark);

    const t = getLangPack();
    document.getElementById('pTitle').textContent = t.title;
    document.getElementById('uploadPhotoBtn').textContent = t.uploadPhoto;
    document.getElementById('nameBoxTitle').textContent = t.nameTitle;
    document.getElementById('nameInput').placeholder = t.namePh;
    document.getElementById('nameBtn').textContent = t.nameBtn;
    document.getElementById('resetBoxTitle').textContent = t.resetTitle;
    document.getElementById('sendOtpBtn').textContent = t.sendOtp;
    document.getElementById('resetOtpInput').placeholder = t.otpPh;
    document.getElementById('newPassInput').placeholder = t.newPassPh;
    document.getElementById('confirmResetBtn').textContent = t.confirmReset;
    document.getElementById('backHomeBtn').textContent = t.back;
  }

  function renderUser(user) {
    const name = user.user_metadata?.full_name || user.email.split('@')[0];
    document.getElementById('profileName').textContent = name;
    document.getElementById('nameInput').value = user.user_metadata?.full_name || '';
    renderAvatar(name);
  }

  async function initProfile() {
    applyPreferences();
    try {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error || !session) {
        window.location.href = 'index.html';
        return;
      }
      activeUser = session.user;
      renderUser(activeUser);
    } catch (err) {
      setMsg(document.getElementById('nameMsg'), getLangPack().errPrefix + err.message, 'err');
    }
  }

  async function saveName() {
    const t = getLangPack();
    const newName = document.getElementById('nameInput').value.trim();
    const msgEl = document.getElementById('nameMsg');
    const btn = document.getElementById('nameBtn');

    if (!newName) {
      setMsg(msgEl, t.emptyName, 'err');
      return;
    }

    btn.disabled = true;
    setMsg(msgEl, t.savingName, '');

    try {
      const { data, error } = await supabaseClient.auth.updateUser({
        data: { full_name: newName }
      });
      if (error) throw error;

      activeUser = data.user;
      renderUser(activeUser);
      setMsg(msgEl, t.nameSaved, 'ok');
    } catch (err) {
      setMsg(msgEl, t.errPrefix + err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  async function sendResetOtp() {
    const t = getLangPack();
    const msgEl = document.getElementById('passMsg');
    const btn = document.getElementById('sendOtpBtn');

    if (!activeUser?.email) return;

    btn.disabled = true;
    setMsg(msgEl, t.sendingOtp, '');

    try {
      const { error } = await supabaseClient.auth.resetPasswordForEmail(activeUser.email);
      if (error) throw error;

      document.getElementById('otpResetSection').style.display = 'block';
      setMsg(msgEl, t.otpSent, 'ok');
    } catch (err) {
      setMsg(msgEl, t.errPrefix + err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  async function verifyOtpAndResetPassword() {
    const t = getLangPack();
    const otpCode = document.getElementById('resetOtpInput').value.trim();
    const newPass = document.getElementById('newPassInput').value;
    const msgEl = document.getElementById('passMsg');
    const btn = document.getElementById('confirmResetBtn');

    if (!/^\d{6}$/.test(otpCode)) {
      setMsg(msgEl, t.invalidOtp, 'err');
      return;
    }

    if (newPass.length < 6) {
      setMsg(msgEl, t.shortPass, 'err');
      return;
    }

    btn.disabled = true;
    setMsg(msgEl, t.resettingPass, '');

    try {
      const { error: otpError } = await supabaseClient.auth.verifyOtp({
        email: activeUser.email,
        token: otpCode,
        type: 'recovery'
      });
      if (otpError) throw otpError;

      const { error: passError } = await supabaseClient.auth.updateUser({
        password: newPass
      });
      if (passError) throw passError;

      document.getElementById('resetOtpInput').value = '';
      document.getElementById('newPassInput').value = '';
      document.getElementById('otpResetSection').style.display = 'none';
      setMsg(msgEl, t.passResetOk, 'ok');
    } catch (err) {
      setMsg(msgEl, t.errPrefix + err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  initProfile();
</script>
</body>
</html>
