<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - Bondhu Apps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#e8c8e8;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:400px;background:linear-gradient(180deg,#2d0a5e 0%,#7b2a9e 40%,#c94b8a 70%,#f07ba8 100%);padding:25px 18px;min-height:100vh;position:relative}
.top{display:flex;align-items:center;gap:12px;color:white;margin-bottom:20px}
.top a{color:white;text-decoration:none;font-size:30px;padding:0 6px}
.top h1{font-size:26px;flex:1}
.logo{width:50px;height:50px;background:#f0e0ff;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#7b2a9e}

.profile-card{background:white;border-radius:20px;padding:22px 18px;margin-bottom:14px;box-shadow:0 8px 20px rgba(0,0,0,0.18)}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#7b2a9e,#e040a8);color:white;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;margin-bottom:12px}
.profile-card h2{color:#1a0a2e;font-size:22px;word-break:break-word}
.profile-card p{color:#555;font-size:14px;margin-top:4px;word-break:break-word}

.box{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 20px rgba(0,0,0,0.15)}
.box h3{color:#1a0a2e;font-size:18px;margin-bottom:10px}
.box input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:12px;font-size:15px;margin-bottom:10px;outline:none}
.box input:focus{border-color:#7b2a9e}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#4b0082,#c94b8a);color:white;font-size:16px;font-weight:bold;cursor:pointer}
.btn:active{opacity:0.9}
.msg{font-size:13px;margin-top:8px;font-weight:bold;min-height:18px}

.back{background:white;color:#1a0a2e;text-align:center;padding:14px;border-radius:12px;font-weight:bold;margin-top:10px;cursor:pointer}
.ver{text-align:center;color:rgba(255,255,255,0.85);font-size:12px;margin-top:18px}
</style>
</head>
<body>

<div class="phone">
  <div class="top">
    <a href="home.html">‹</a>
    <h1>Profile</h1>
    <div class="logo">B</div>
  </div>

  <div class="profile-card">
    <div class="avatar" id="avatarLetter">B</div>
    <h2 id="profileName">Loading...</h2>
    <p id="profileEmail">...</p>
  </div>

  <div class="box">
    <h3>✏️ নাম পরিবর্তন করুন</h3>
    <input type="text" id="nameInput" placeholder="আপনার নতুন নাম লিখুন">
    <button class="btn" onclick="saveName()">নাম সেভ করুন</button>
    <div class="msg" id="nameMsg"></div>
  </div>

  <div class="box">
    <h3>🔒 পাসওয়ার্ড পরিবর্তন করুন</h3>
    <input type="password" id="passInput" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
    <button class="btn" onclick="savePassword()">পাসওয়ার্ড আপডেট করুন</button>
    <div class="msg" id="passMsg"></div>
  </div>

  <div class="back" onclick="location.href='home.html'">Back to Home</div>
  <div class="ver">Bondhu Apps • Version 1.1 Trial</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ujhjloihskutkazhaydc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_EqE3D3fqYSf5C13Ds0wNyQ_ZeDHoJfH";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;

  function renderUser(user) {
    currentUser = user;
    const name = user.user_metadata?.full_name || user.email.split('@')[0];
    document.getElementById('profileName').textContent = name;
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('nameInput').value = user.user_metadata?.full_name || '';
    document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();
  }

  async function initProfile() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error || !session) {
      window.location.href = 'index.html';
      return;
    }
    renderUser(session.user);
  }

  async function saveName() {
    const newName = document.getElementById('nameInput').value.trim();
    const msgEl = document.getElementById('nameMsg');

    if (!newName) {
      msgEl.style.color = 'red';
      msgEl.textContent = 'দয়া করে একটি নাম লিখুন।';
      return;
    }

    msgEl.style.color = '#7b2a9e';
    msgEl.textContent = 'সেভ হচ্ছে...';

    const { data, error } = await supabaseClient.auth.updateUser({
      data: { full_name: newName }
    });

    if (error) {
      msgEl.style.color = 'red';
      msgEl.textContent = 'ত্রুটি: ' + error.message;
    } else {
      renderUser(data.user);
      msgEl.style.color = 'green';
      msgEl.textContent = 'নাম সফলভাবে আপডেট হয়েছে!';
    }
  }

  async function savePassword() {
    const newPass = document.getElementById('passInput').value;
    const msgEl = document.getElementById('passMsg');

    if (newPass.length < 6) {
      msgEl.style.color = 'red';
      msgEl.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।';
      return;
    }

    msgEl.style.color = '#7b2a9e';
    msgEl.textContent = 'পাসওয়ার্ড পরিবর্তন হচ্ছে...';

    const { error } = await supabaseClient.auth.updateUser({
      password: newPass
    });

    if (error) {
      msgEl.style.color = 'red';
      msgEl.textContent = 'ত্রুটি: ' + error.message;
    } else {
      document.getElementById('passInput').value = '';
      msgEl.style.color = 'green';
      msgEl.textContent = 'পাসওয়ার্ড সফলভাবে পরিবর্তিত হয়েছে!';
    }
  }

  initProfile();
</script>
</body>
</html>
