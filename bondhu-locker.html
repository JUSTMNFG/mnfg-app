<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bondhu Locker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
  background:linear-gradient(145deg,#100824,#32105b,#701c78);
  min-height:100vh;color:#fff;padding:18px;
}
.box{max-width:420px;margin:0 auto}
.card{
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.28);
  border-radius:16px;padding:18px;margin-bottom:16px;
}
h1{font-size:22px;margin-bottom:8px}
p{font-size:14px;color:#eadcf7;line-height:1.5}
input,textarea{
  width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.35);
  background:#18092e;color:#fff;font-size:15px;margin-top:10px;
}
textarea{min-height:80px}
button{
  width:100%;padding:13px;border:0;border-radius:10px;
  background:linear-gradient(90deg,#8c42d5,#d044a0);
  color:#fff;font-size:15px;font-weight:bold;margin-top:12px;cursor:pointer;
}
.lock-btn{background:#d62839}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{
  background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);
  border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;
}
.tile span{display:block;font-size:28px;margin-bottom:6px}
.msg{margin-top:10px;font-size:13px;color:#9ef7b8;min-height:18px}
.err{margin-top:10px;font-size:13px;color:#ff94a8;min-height:18px}
.item-card{
  background:#160829;border:1px solid rgba(255,255,255,0.25);
  border-radius:10px;padding:12px;margin-top:10px;font-size:14px;
}
.hidden{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="card" id="pinScreen">
    <h1 id="pinHeading">🔐 বন্ধু লকার</h1>
    <p id="pinSub">প্রথমবার ঢুকলে ৪–৬ সংখ্যার একটি PIN সেট করুন।</p>
    <input type="password" id="pinInput" maxlength="6" inputmode="numeric" placeholder="৪–৬ সংখ্যার PIN লিখুন">
    <button type="button" id="pinActionBtn">PIN সেট করুন</button>
    <div class="err" id="errText"></div>
    <div class="msg" id="okText"></div>
  </div>

  <div id="vaultScreen" class="hidden">
    <div class="card">
      <h1>🔓 বন্ধু লকার খোলা আছে</h1>
      <p>নিচের যেকোনো বক্সে চাপ দিয়ে তথ্য যোগ করতে বা দেখতে পারেন।</p>

      <div class="grid" id="menuGrid">
        <div class="tile" data-cat="ছবি"><span>🖼️</span><strong>ছবি</strong></div>
        <div class="tile" data-cat="ভিডিও"><span>🎬</span><strong>ভিডিও</strong></div>
        <div class="tile" data-cat="ডকুমেন্ট"><span>📄</span><strong>ডকুমেন্ট</strong></div>
        <div class="tile" data-cat="পাসওয়ার্ড"><span>🔑</span><strong>পাসওয়ার্ড</strong></div>
        <div class="tile" style="grid-column:span 2" data-cat="নোট"><span>📝</span><strong>Secret Notes</strong></div>
      </div>

      <button type="button" class="lock-btn" id="lockBtn">লকার বন্ধ করুন</button>
    </div>

    <div class="card hidden" id="detailBox">
      <h2 id="catName"></h2>
      <input type="text" id="titleInput" placeholder="নাম বা শিরোনাম লিখুন">
      <textarea id="noteInput" placeholder="তথ্য বা পাসওয়ার্ড লিখুন"></textarea>
      <button type="button" id="saveItemBtn">সেভ করুন</button>
      <button type="button" id="backMenuBtn">সব বক্সে ফিরে যান</button>
      <div id="savedList"></div>
    </div>
  </div>
</div>

<script>
const PIN_KEY = "simple_locker_pin_v1";
const DATA_KEY = "simple_locker_data_v1";
let activeCat = "";

const pinScreen = document.getElementById("pinScreen");
const vaultScreen = document.getElementById("vaultScreen");
const pinHeading = document.getElementById("pinHeading");
const pinSub = document.getElementById("pinSub");
const pinInput = document.getElementById("pinInput");
const pinActionBtn = document.getElementById("pinActionBtn");
const errText = document.getElementById("errText");
const okText = document.getElementById("okText");
const menuGrid = document.getElementById("menuGrid");
const detailBox = document.getElementById("detailBox");
const catName = document.getElementById("catName");
const titleInput = document.getElementById("titleInput");
const noteInput = document.getElementById("noteInput");
const savedList = document.getElementById("savedList");

function setupPinUi() {
  const savedPin = localStorage.getItem(PIN_KEY);
  if (!savedPin) {
    pinHeading.textContent = "🔐 নতুন PIN সেট করুন";
    pinSub.textContent = "লকারে ঢোকার জন্য ৪ থেকে ৬ সংখ্যার একটি PIN দিন।";
    pinActionBtn.textContent = "PIN সেট করুন";
  } else {
    pinHeading.textContent = "🔐 লকার খুলুন";
    pinSub.textContent = "আপনার সেট করা PIN লিখে লকার খুলুন।";
    pinActionBtn.textContent = "লকার খুলুন";
  }
}

pinActionBtn.addEventListener("click", function () {
  errText.textContent = "";
  okText.textContent = "";
  const val = pinInput.value.trim();
  if (!/^\d{4,6}$/.test(val)) {
    errText.textContent = "দয়া করে ৪ থেকে ৬ সংখ্যার নম্বর দিন।";
    return;
  }

  const savedPin = localStorage.getItem(PIN_KEY);
  if (!savedPin) {
    localStorage.setItem(PIN_KEY, val);
    pinInput.value = "";
    okText.textContent = "PIN সেট হয়েছে! এখন লকার খুলছে...";
    setTimeout(openVault, 300);
    return;
  }

  if (val === savedPin) {
    pinInput.value = "";
    openVault();
  } else {
    errText.textContent = "PIN ঠিক হয়নি, আবার চেষ্টা করুন।";
  }
});

function openVault() {
  pinScreen.classList.add("hidden");
  vaultScreen.classList.remove("hidden");
  detailBox.classList.add("hidden");
  menuGrid.classList.remove("hidden");
}

document.getElementById("lockBtn").addEventListener("click", function () {
  vaultScreen.classList.add("hidden");
  pinScreen.classList.remove("hidden");
  pinInput.value = "";
  errText.textContent = "";
  okText.textContent = "";
  setupPinUi();
});

menuGrid.addEventListener("click", function (e) {
  const tile = e.target.closest(".tile");
  if (!tile) return;
  activeCat = tile.getAttribute("data-cat");
  catName.textContent = activeCat;
  menuGrid.classList.add("hidden");
  detailBox.classList.remove("hidden");
  renderItems();
});

document.getElementById("backMenuBtn").addEventListener("click", function () {
  detailBox.classList.add("hidden");
  menuGrid.classList.remove("hidden");
});

document.getElementById("saveItemBtn").addEventListener("click", function () {
  const t = titleInput.value.trim();
  const n = noteInput.value.trim();
  if (!t || !n) {
    alert("নাম এবং তথ্য দুটোই লিখুন।");
    return;
  }
  const all = JSON.parse(localStorage.getItem(DATA_KEY) || "{}");
  all[activeCat] = all[activeCat] || [];
  all[activeCat].unshift({ title: t, note: n });
  localStorage.setItem(DATA_KEY, JSON.stringify(all));
  titleInput.value = "";
  noteInput.value = "";
  renderItems();
});

function renderItems() {
  const all = JSON.parse(localStorage.getItem(DATA_KEY) || "{}");
  const list = all[activeCat] || [];
  if (!list.length) {
    savedList.innerHTML = "<p style='margin-top:12px'>এখনো কিছু সেভ করা হয়নি।</p>";
    return;
  }
  savedList.innerHTML = list.map(function (row) {
    return "<div class='item-card'><strong>" + row.title + "</strong><br>" + row.note + "</div>";
  }).join("");
}

setupPinUi();
</script>
</body>
</html>
