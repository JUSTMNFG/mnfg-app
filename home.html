body{
  background:#1a002e;
  display:flex;
  justify-content:center;
  min-height:100vh;
  transition:background 0.25s ease;
}
body.dark-body{background:#090312}

.phone{
  width:100%;

  min-height:100vh;
  background:linear-gradient(180deg,#4b0082 0%,#7b1fa2 38%,#d946a8 76%,#ff6eb4 100%);
  padding:18px 16px 32px;
  color:#fff;
  transition:background 0.25s ease;
}
.phone.dark-mode{
  background:linear-gradient(180deg,#0c041a 0%,#1a0936 45%,#28104a 100%);
}

.topbar{
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:20px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.phone.dark-mode .topbar{
  background:rgba(27,17,43,0.88);
  border-color:rgba(255,255,255,0.1);
}

.brand{display:flex;align-items:center;gap:10px}
.logo{

  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.3);
}
.logo b{

}
.brand-title{font-size:20px;font-weight:800;color:#fff}

.top-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:none;
  background:rgba(255,255,255,0.22);color:#fff;font-size:17px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.phone.dark-mode .icon-btn{background:#2a1945}

.nav-tabs{
  display:flex;gap:6px;overflow-x:auto;
  background:rgba(255,255,255,0.16);
  padding:6px;border-radius:16px;margin-bottom:14px;
  scrollbar-width:none;
}
.nav-tabs::-webkit-scrollbar{display:none}
.phone.dark-mode .nav-tabs{background:#190f29}

.tab-btn{

.tab-btn.active{

}
.phone.dark-mode .tab-btn.active{

  padding:16px;
  margin-bottom:14px;

}
.phone.dark-mode .glass-card{

  color:#f5eeff;
  border:1px solid rgba(255,255,255,0.09);
}

.hello-row{display:flex;align-items:center;gap:12px}
.avatar{

.hello-title{font-size:18px;font-weight:800;color:#2d0a5e}
.phone.dark-mode .hello-title{color:#fff}
.hello-sub{font-size:12px;color:#555;margin-top:2px}
.phone.dark-mode .hello-sub{color:#cbbde6}

.post-composer{margin-top:12px}
.post-textarea{

  background:#fff;color:#1c0b30;
}
.phone.dark-mode .post-textarea{

.composer-footer{

.post-btn{

.section-view{display:none}

function getLangCode() {
  const l = localStorage.getItem('bondhu_lang') || 'বাংলা';
  return i18n[l] ? l : 'বাংলা';
}

function t() {
  return i18n[getLangCode()];
}

function showToast(text) {
  const box = document.getElementById('toastBox');
  box.textContent = text;
  box.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    box.style.display = 'none';
  }, 2200);
}

function applyThemeAndLanguage() {
  const isDark = localStorage.getItem('bondhu_darkMode') === 'true';
  document.getElementById('phoneFrame').classList.toggle('dark-mode', isDark);
  document.body.classList.toggle('dark-body', isDark);

  const pack = t();
  document.getElementById('tabHome').textContent = pack.tabHome;
  document.getElementById('tabFriends').textContent = pack.tabFriends;
  document.getElementById('tabChat').textContent = pack.tabChat;
  document.getElementById('tabVideo').textContent = pack.tabVideo;
  document.getElementById('tabProfile').textContent = pack.tabProfile;
  document.getElementById('welcomeText').textContent = pack.welcome;
  document.getElementById('postInput').placeholder = pack.postPh;
  document.getElementById('postHint').textContent = pack.postHint;
  document.getElementById('createPostBtn').textContent = pack.postBtn;
  document.getElementById('friendsHeading').textContent = pack.friendsHeading;
  document.getElementById('chatHeading').textContent = pack.chatHeading;
  document.getElementById('chatInput').placeholder = pack.chatPh;
  document.getElementById('chatSendBtn').textContent = pack.send;
  document.getElementById('videoHeading').textContent = pack.videoHeading;
  document.getElementById('videoDesc').textContent = pack.videoDesc;
  document.getElementById('logoutBtn').textContent = pack.logout;

  if (currentUser) {
    document.getElementById('userSubText').textContent = `${currentDisplayName} • ${pack.readySub}`;
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

  const container = document.getElementById('feedList');

  if (!posts.length) {
    container.innerHTML = `
      <div class="glass-card" style="text-align:center">
        <p style="font-size:14px;opacity:0.8">${pack.postPh}</p>
      </div>`;
    return;
  }

  container.innerHTML = posts.map(post => {
    const isLiked = Array.isArray(post.likedBy) && currentUser && post.likedBy.includes(currentUser.id);
    const commentsHtml = (post.comments || []).map(c =>
      `<div class="comment-item"><b>${escapeHtml(c.author)}:</b> ${escapeHtml(c.text)}</div>`
    ).join('');

    return `
      <div class="feed-card" id="post-${post.id}">
        <div class="post-head">
          <div class="small-avatar">${escapeHtml((post.author || 'B').charAt(0).toUpperCase())}</div>

            <div class="post-author">${escapeHtml(post.author)}</div>
            <div class="post-meta">${escapeHtml(post.time)}</div>
          </div>
        </div>
        <div class="post-body">${escapeHtml(post.content)}</div>
        <div class="post-actions">
          <button class="act-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
            ♥ ${pack.like} (${(post.likedBy || []).length})
          </button>
          <button class="act-btn" onclick="focusComment('${post.id}')">
            💬 ${pack.comment} (${(post.comments || []).length})
          </button>
          <button class="act-btn" onclick="sharePost('${post.id}')">
            ↗ ${pack.share}
          </button>
        </div>
        <div class="comment-box">
          ${commentsHtml}
          <div class="comment-row">
            <input type="text" class="comment-input" id="cinput-${post.id}" placeholder="${pack.commentPh}">
            <button class="comment-send" onclick="addComment('${post.id}')">${pack.send}</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function addPost() {
  const input = document.getElementById('postInput');
  const text = input.value.trim();
  if (!text) {
    showToast(t().emptyPost);
    return;
  }

  const nowLabel = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  posts.unshift({
    id: 'p_' + Date.now(),
    author: currentDisplayName,
    time: nowLabel,
    content: text,
    likedBy: [],
    comments: []
  });

  savePosts();
  input.value = '';
  renderFeed();
  showToast(t().postPublished);
}
