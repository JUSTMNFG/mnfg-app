<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bondhu Apps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#e8c8e8;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:400px;background:linear-gradient(180deg,#2d0a5e 0%,#7b2a9e 40%,#c94b8a 70%,#f07ba8 100%);padding:25px 18px;min-height:100vh;position:relative}
.top{display:flex;align-items:center;gap:12px;color:white;margin-bottom:18px}
.logo{width:55px;height:55px;background:linear-gradient(135deg,#d78bff,#7b2a9e);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;font-style:italic;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.top h1{font-size:28px}
.trial{text-align:right;margin-top:-6px;margin-bottom:12px}
.trial span{background:#f8c8dc;color:#333;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:bold}
.card{background:white;border-radius:18px;padding:22px;margin-bottom:14px}
.card h2{font-size:24px;color:#1a0a2e;word-break:break-word}
.card p{color:#444;margin-top:4px;font-size:14px}
.menu{background:white;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:12px;cursor:pointer;transition:transform 0.15s,background 0.15s}
.menu:active{transform:scale(0.98);background:#f7f2fa}
.icon{width:45px;height:45px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.i1{background:#e8d5ff}.i2{background:#d5c8ff}.i3{background:#ffc8ec}
.menu b{font-size:20px;flex:1;color:#1a0a2e}
.menu span{color:#999;font-size:20px}
.logout{background:#e51e3a;color:white;text-align:center;padding:16px;border-radius:12px;font-size:22px;font-weight:bold;margin-top:18px;cursor:pointer;transition:opacity 0.2s}
.logout:active{opacity:0.85}
.ver{text-align:center;color:rgba(255,255,255,0.8);font-size:12px;margin-top:20px}

/* Modal Styles */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;padding:20px;z-index:100}
.modal{background:white;width:100%;max-width:350px;border-radius:18px;padding:22px;box-shadow:0 10px 25px rgba(0,0,0,0.3)}
.modal h3{color:#1a0a2e;margin-bottom:12px;font-size:20px}
.modal p{color:#555;font-size:14px;margin-bottom:14px;line-height:1.4}
.modal input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:12px;font-size:15px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn{padding:10px 16px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px}
.btn-primary{background:#7b2a9e;color:white}
.btn-close{background:#eee;color:#333}
.status-msg{font-size:13px;margin-bottom:10px;font-weight:bold}
</style>
</head>
<body>

<div class="phone">
  <div class="top"><div class="logo">B</div><h1>Bondhu Apps</h1></div>
  <div class="trial"><span id="accountBadge">✦ Trial</span></div>
  
  <div class="card">
    <h2 id="welcomeName">Hello Friend!</h2>
    <p id="userEmail">Welcome to Bondhu Apps</p>
  </div>

  <div class="menu" onclick="openSettings()">
    <div class="icon i1">⚙️</div><b>Settings</b><span>›</span>
  </div>
  
  <div class="menu" onclick="openSecurity()">
    <div class="icon i2">🔒</div><b>Security</b><span>›</span>
  </div>
  
  <div class="menu" onclick="checkUpdate()">
    <div class="icon i3">🔄</div><b>Check Update</b><span>›</span>
  </div>

  <div class="logout" id="logoutBtn" onclick="handleLogout()">Logout</div>
  <div class="ver">Bondhu Apps • Version 1.1 Trial</div>
</div>

<!-- Dynamic Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ujhjloihskutkazhaydc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_EqE3D3fqYSf5C13Ds0wNyQ_ZeDHoJfH";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;

  async function checkAuth() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    
    if (error || !session) {
      window.location.href = 'index.html';
      return;
    }

    currentUser = session.user;
    const displayName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
    document.getElementById('welcomeName').textContent = `Hello, ${displayName}!`;
    document.getElementById('userEmail').textContent = currentUser.email;
  }

  function showModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function openSettings() {
    window.location.href = 'settings.html';
  }

  function openSecurity() {
    showModal(`
      <h3>🔒 Security Settings</h3>
      <p>নতুন পাসওয়ার্ড সেট করুন (কমপক্ষে ৬ অক্ষরের):</p>
      <input type="password" id="newPassInput" placeholder="নতুন পাসওয়ার্ড দিন">
      <div id="securityStatus" class="status-msg"></div>
      <div class="modal-btns">
        <button class="btn btn-close" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="updatePassword()">Update Password</button>
      </div>
    `);
  }

  async function updatePassword() {
    const newPassword = document.getElementById('newPassInput').value;
    const statusEl = document.getElementById('securityStatus');

    if (newPassword.length < 6) {
      statusEl.style.color = 'red';
      statusEl.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।';
      return;
    }

    statusEl.style.color = '#7b2a9e';
    statusEl.textContent = 'পাসওয়ার্ড পরিবর্তন হচ্ছে...';

    const { error } = await supabaseClient.auth.updateUser({
      password: newPassword
    });

    if (error) {
      statusEl.style.color = 'red';
      statusEl.textContent = 'ত্রুটি: ' + error.message;
    } else {
      statusEl.style.color = 'green';
      statusEl.textContent = 'পাসওয়ার্ড সফলভাবে পরিবর্তিত হয়েছে!';
      setTimeout(closeModal, 1200);
    }
  }

  function checkUpdate() {
    showModal(`
      <h3>🔄 Check Update</h3>
      <p><strong>অ্যাপ:</strong> Bondhu Apps<br>
      <strong>বর্তমান ভার্সন:</strong> Version 1.1 (Trial)<br><br>
      ✅ আপনি সর্বশেষ ভার্সনটি ব্যবহার করছেন। নতুন কোনো আপডেট নেই।</p>
      <div class="modal-btns">
        <button class="btn btn-primary" onclick="closeModal()">OK</button>
      </div>
    `);
  }

  async function handleLogout() {
    const btn = document.getElementById('logoutBtn');
    btn.textContent = 'Logging out...';
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }

  checkAuth();
</script>
</body>
                                  </html>
