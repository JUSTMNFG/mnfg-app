.icon{width:45px;height:45px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.i1{background:#e8d5ff}.i2{background:#d5c8ff}.i3{background:#ffc8ec}
.menu b{font-size:20px;flex:1}
.menu span{color:#999;font-size:20px}
.logout{background:#e51e3a;color:white;text-align:center;padding:16px;border-radius:12px;font-size:22px;font-weight:bold;margin-top:18px}
.ver{text-align:center;color:rgba(255,255,255,0.7);font-size:12px;margin-top:20px}
