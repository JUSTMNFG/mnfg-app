<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bondhu Locker</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a0b2e, #2b1055);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .back-link {
      color: #cbb8ff;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      margin-bottom: 8px;
      font-family: inherit;
    }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #6c5ce7;
      color: #fff;
      cursor: pointer;
    }
    .note-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      margin-bottom: 8px;
    }
    .del-btn {
      background: rgba(255, 80, 80, 0.25);
      color: #ffb3b3;
      padding: 5px 9px;
      font-size: 12px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h2 style="margin:0; font-size:20px;">Bondhu Locker</h2>
      <a href="home.html" class="back-link">← Home</a>
    </div>

    <div class="card">
      <input type="text" id="lockerTitle" placeholder="নোট বা আইটেমের শিরোনাম..." />
      <textarea id="lockerSecret" rows="3" placeholder="ব্যক্তিগত তথ্য বা নোট লিখুন..."></textarea>
      <button type="button" id="saveLockerBtn">Save to Locker</button>
    </div>

    <div class="card" id="lockerList"></div>
  </div>

  <script>
    (function() {
      const titleEl = document.getElementById('lockerTitle');
      const secretEl = document.getElementById('lockerSecret');
      const saveBtn = document.getElementById('saveLockerBtn');
      const listEl = document.getElementById('lockerList');
      const KEY = 'bondhu_locker_items';

      function getItems() {
        try {
          return JSON.parse(localStorage.getItem(KEY)) || [];
        } catch (e) {
          return [];
        }
      }

      function saveItems(items) {
        localStorage.setItem(KEY, JSON.stringify(items));
      }

      function esc(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function render() {
        const items = getItems();
        if (!items.length) {
          listEl.innerHTML = '<p style="margin:0; font-size:13px; opacity:0.75;">লকারে এখনো কিছু সেভ করা হয়নি।</p>';
          return;
        }
        listEl.innerHTML = items.map(function(item, idx) {
          return (
            '<div class="note-item">' +
              '<div>' +
                '<div style="font-weight:600; font-size:14px;">' + esc(item.title) + '</div>' +
                '<div style="font-size:13px; opacity:0.85; margin-top:4px; white-space:pre-wrap;">' + esc(item.secret) + '</div>' +
              '</div>' +
              '<button type="button" class="del-btn" data-del="' + idx + '">Delete</button>' +
            '</div>'
          );
        }).join('');
      }

      saveBtn.addEventListener('click', function() {
        const title = titleEl.value.trim();
        const secret = secretEl.value.trim();
        if (!title && !secret) return;
        const items = getItems();
        items.unshift({ title: title || 'Untitled', secret: secret });
        saveItems(items);
        titleEl.value = '';
        secretEl.value = '';
        render();
      });

      listEl.addEventListener('click', function(e) {
        const btn = e.target.closest('[data-del]');
        if (!btn) return;
        const idx = Number(btn.getAttribute('data-del'));
        const items = getItems();
        items.splice(idx, 1);
        saveItems(items);
        render();
      });

      render();
    })();
  </script>
</body>
</html>
