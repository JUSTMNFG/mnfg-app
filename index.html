<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{

 display:flex;
 justify-content:center;
 min-height:100vh

.phone{

 max-width:420px;

 text-align:center;

 overflow:hidden

.logo{
 width:140px;
 height:140px;
 margin:8px auto 14px;
 background:radial-gradient(circle at 30% 30%,#ff7ad9,#7b1fa2 65%,#4b0082);
 border-radius:50%;

 justify-content:center;

.logo b{

 font-size:100px;

 font-style:italic;

 transform:translateY(-4px)

h1{color:#fff;font-size:35px;font-weight:800;letter-spacing:.5px}

.tag{color:#fff;font-size:15px;margin-bottom:22px;opacity:.95}

.card{
 background:#fff;
 border-radius:22px;
 padding:22px 16px 20px;
 box-shadow:0 15px 30px rgba(0,0,0,.25)
}

.input{
 width:100%;
 height:52px;
 border:1.5px solid #e8e8e8;
 border-radius:12px;
 padding:0 12px;
 font-size:15px;
 outline:none;
 margin-bottom:14px;
 background:#fff
}

.input:focus{border-color:#9c27b0}

.btn-login{
 width:100%;
 height:56px;
 border:none;
 border-radius:12px;
 background:linear-gradient(90deg,#4b0082,#e040a8);
 color:#fff;
 font-size:22px;
 font-weight:700;
 cursor:pointer
}

.btn-create{
 width:100%;
 height:48px;
 border:none;
 border-radius:12px;
 background:#d1d1d1;
 color:#333;
 font-size:16px;
 font-weight:600;
 margin-top:12px;
 cursor:pointer
}

button:disabled{opacity:.6;cursor:not-allowed}

.version{
 color:rgba(255,255,255,0.85);
 font-size:12px;
 margin-top:20px;
 font-weight:600
}

#updateBox{
 display:none;
 background:#fff;
 color:#222;
 border-radius:14px;
 padding:14px;
 margin-bottom:14px;
 text-align:left
}

#updateBox b{color:#d81b60}

#updateBox button{
 width:100%;
 height:42px;
 border:none;
 border-radius:10px;
 background:#25D366;
 color:#fff;
 font-weight:700;
 margin-top:10px;
 cursor:pointer
}

#otpScreen,#resetScreen{display:none}

#msg{
 font-size:13px;
 min-height:20px;
 margin-top:12px;
 overflow-wrap:anywhere;
 color:#fff;
 font-weight:600
}

.small-link{
 color:#7b1fa2;
 font-size:14px;
 margin-top:14px;
 cursor:pointer;
 font-weight:600
}

#otp{
 text-align:center;
 font-size:23px;
 letter-spacing:8px;
 font-weight:700
}

#otpScreen p,#resetScreen p{
 font-size:14px;
 margin-bottom:15px;
 color:#444
}
</style>

<body>

<div class="phone">

<div class="logo"><b>B</b></div>

<h1>Bondhu Apps</h1>
<p class="tag" id="tagText">Your Friend, With You</p>

<div id="updateBox">
<b>🎉 নতুন আপডেট আসছে!</b><br>
<span id="updateText"></span>
<button onclick="doUpdate()">এখন আপডেট করো</button>
</div>

<!-- LOGIN SCREEN -->
<div class="card" id="authScreen">

<h3 id="welcomeHeading" style="margin-bottom:18px;color:#4b0082">Welcome Back</h3>

<input id="email" class="input"
type="email" placeholder="তোমার ইমেইল দাও"
autocomplete="email">

<div style="position:relative">
<input id="pass" class="input"
type="password" placeholder="পাসওয়ার্ড (৬+ অক্ষর)"
autocomplete="current-password">

<span onclick="showPass()"
style="position:absolute;right:12px;top:13px;cursor:pointer">👁️</span>
</div>

<button class="btn-login" id="loginBtn" onclick="login()">Login</button>

<button class="btn-create" id="signupBtn" onclick="createAcc()">Create New Account</button>

<div class="small-link" id="forgotLink" onclick="forgotPassword()">পাসওয়ার্ড ভুলে গেছো?</div>

</div>

<!-- OTP SCREEN -->
<div class="card" id="otpScreen">

<h3 id="otpTitle" style="color:#4b0082;margin-bottom:15px">Email Verification</h3>

<p id="otpDesc">তোমার ইমেইলে ৬ সংখ্যার OTP পাঠানো হয়েছে। কোডটি এখানে দাও।</p>

<input id="otp" class="input"
type="text" maxlength="6" inputmode="numeric"
placeholder="৬ সংখ্যার OTP" autocomplete="one-time-code">

<button class="btn-login" id="verifyBtn" onclick="verifyOtp()">Verify OTP</button>

<button class="btn-create" id="resendBtn" onclick="resendOtp()">আবার OTP পাঠাও</button>

<div class="small-link" id="backLoginLink" onclick="backToLogin()">পিছনে যাও</div>

</div>

<!-- PASSWORD RESET SCREEN -->
<div class="card" id="resetScreen">

<h3 id="resetTitle" style="color:#4b0082;margin-bottom:15px">New Password</h3>

<p id="resetDesc">তোমার নতুন পাসওয়ার্ড দাও।</p>

<input id="newPass" class="input"
type="password" placeholder="নতুন পাসওয়ার্ড (৬+ অক্ষর)">

<button class="btn-login" id="updatePassBtn" onclick="updatePassword()">পাসওয়ার্ড পরিবর্তন করো</button>

</div>

<div id="msg"></div>

<div class="version">Bondhu Apps • Version 1.1 Trial</div>

</div>

<script>

function getAuthLang() {
  const saved = localStorage.getItem('bondhu_lang');
  return authTexts[saved] ? authTexts[saved] : authTexts['বাংলা'];
}

function applyAuthLanguage() {
  const t = getAuthLang();
  document.getElementById('tagText').innerText = t.tag;
  document.getElementById('welcomeHeading').innerText = t.welcome;
  document.getElementById('email').placeholder = t.emailPh;
  document.getElementById('pass').placeholder = t.passPh;
  document.getElementById('loginBtn').innerText = t.login;
  document.getElementById('signupBtn').innerText = t.signup;
  document.getElementById('forgotLink').innerText = t.forgot;
  document.getElementById('otpTitle').innerText = t.otpTitle;
  document.getElementById('otpDesc').innerText = t.otpDesc;
  document.getElementById('otp').placeholder = t.otpPh;
  document.getElementById('verifyBtn').innerText = t.verify;
  document.getElementById('resendBtn').innerText = t.resend;
  document.getElementById('backLoginLink').innerText = t.back;
  document.getElementById('resetTitle').innerText = t.resetTitle;
  document.getElementById('resetDesc').innerText = t.resetDesc;
  document.getElementById('newPass').placeholder = t.newPassPh;
  document.getElementById('updatePassBtn').innerText = t.updatePass;
}

// UPDATE SYSTEM
const CURRENT_VERSION = "1.1";
const LATEST_VERSION = "1.1";

const UPDATE_LINK_ANDROID = "https://play.google.com/store";
const UPDATE_LINK_IPHONE = "https://apps.apple.com";

if (LATEST_VERSION !== CURRENT_VERSION) {
  document.getElementById("updateBox").style.display = "block";
  document.getElementById("updateText").innerText = "Version " + LATEST_VERSION + " পাওয়া গেছে।";
}

function doUpdate() {
  const iphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  window.open(iphone ? UPDATE_LINK_IPHONE : UPDATE_LINK_ANDROID, "_blank");
}

function message(t, c = "#fff") {
  const m = document.getElementById("msg");
  m.innerText = t;
  m.style.color = c;
}

function loading(id, on, t) {
  const b = document.getElementById(id);
  if (on) {
    b.dataset.old = b.innerText;
    b.innerText = t;
    b.disabled = true;
  } else {
    b.disabled = false;
    if (b.dataset.old) b.innerText = b.dataset.old;
  }
}

function validEmail(e) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
}

function showScreen(id) {
  ["authScreen", "otpScreen", "resetScreen"].forEach(x => {
    document.getElementById(x).style.display = "none";
  });
  document.getElementById(id).style.display = "block";
}

function showPass() {
  const p = document.getElementById("pass");
  p.type = p.type === "password" ? "text" : "password";
}

function backToLogin() {
  showScreen("authScreen");
  message("");
}

// LOGIN
async function login() {
  const t = getAuthLang();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("pass").value;

  if (!validEmail(email)) {
    message(t.invalidEmail, "#ffe082");
    return;
  }

  if (password.length < 6) {
    message(t.shortPass, "#ffe082");
    return;
  }

  loading("loginBtn", true, t.loggingIn);

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email, password
    });

    if (error) throw error;

    if (data.session) {
      message(t.loginSuccess, "#a5d6a7");
      window.location.replace(HOME_PAGE);
    }
  } catch (e) {
    message("Login error: " + e.message, "#ff8a80");
  } finally {
    loading("loginBtn", false);
  }
}

// CREATE NEW ACCOUNT
async function createAcc() {
  const t = getAuthLang();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("pass").value;

  if (!validEmail(email)) {
    message(t.invalidEmail, "#ffe082");
    return;
  }

  if (password.length < 6) {
    message(t.shortPass, "#ffe082");
    return;
  }

  currentEmail = email;
  loading("signupBtn", true, t.creating);

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: window.location.origin + window.location.pathname
      }
    });

    if (error) throw error;

    // Supabase-এ Confirm email বন্ধ থাকলে সরাসরি session তৈরি হয়
    if (data.session) {
      message(t.accountCreated, "#a5d6a7");
      window.location.replace(HOME_PAGE);
      return;
    }

    // Confirm email চালু থাকলে OTP স্ক্রিনে নিয়ে যাবে
    showScreen("otpScreen");
    message(t.otpSent, "#a5d6a7");
  } catch (e) {
    message("Signup error: " + e.message, "#ff8a80");
  } finally {
    loading("signupBtn", false);
  }
}

// OTP VERIFY
async function verifyOtp() {
  const token = document.getElementById("otp").value.trim();

  if (!currentEmail) {
    message("Email not found. Try signing up again.", "#ff8a80");
    return;
  }

  if (!/^\d{6}$/.test(token)) {
    message("Enter a 6-digit OTP", "#ffe082");
    return;
  }

  loading("verifyBtn", true, "Verifying...");

  try {
    const { data, error } = await supabaseClient.auth.verifyOtp({
      email: currentEmail,
      token,
      type: "signup"
    });

    if (error) throw error;

    if (data.session) {
      message("Verification successful!", "#a5d6a7");
      window.location.replace(HOME_PAGE);
    } else {
      backToLogin();
      message("Verified! Please login now.", "#a5d6a7");
    }
  } catch (e) {
    message("OTP error: " + e.message, "#ff8a80");
  } finally {
    loading("verifyBtn", false);
  }
}

// RESEND OTP
async function resendOtp() {
  if (!currentEmail) {
    message("Email not found", "#ff8a80");
    return;
  }

  loading("resendBtn", true, "Sending OTP...");

  try {
    const { error } = await supabaseClient.auth.resend({
      type: "signup",
      email: currentEmail
    });

    if (error) throw error;

    message("New OTP sent!", "#a5d6a7");
  } catch (e) {
    message("Resend error: " + e.message, "#ff8a80");
  } finally {
    loading("resendBtn", false);
  }
}

// FORGOT PASSWORD
async function forgotPassword() {
  const email = document.getElementById("email").value.trim();

  if (!validEmail(email)) {
    message(getAuthLang().invalidEmail, "#ffe082");
    return;
  }

  message("Sending reset link...");

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname + "?reset=1"
    });

    if (error) throw error;

    message("If the account exists, a reset link has been sent.", "#a5d6a7");
  } catch (e) {
    message(e.message, "#ff8a80");
  }
}

// UPDATE PASSWORD
async function updatePassword() {
  const password = document.getElementById("newPass").value;

  if (password.length < 6) {
    message(getAuthLang().shortPass, "#ffe082");
    return;
  }

  loading("updatePassBtn", true, "Updating...");

  try {
    const { error } = await supabaseClient.auth.updateUser({ password });
    if (error) throw error;

    message("Password updated!", "#a5d6a7");
    window.location.replace(HOME_PAGE);
  } catch (e) {
    message(e.message, "#ff8a80");
  } finally {
    loading("updatePassBtn", false);
  }
}

// SESSION & PASSWORD RECOVERY
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    showScreen("resetScreen");
    message("Set your new password.", "#a5d6a7");
  }
});

async function checkSession() {
  const { data, error } = await supabaseClient.auth.getSession();
  if (error) {
    console.error(error);
    return;
  }

  if (data.session && new URLSearchParams(location.search).get("reset") !== "1") {
    window.location.replace(HOME_PAGE);
  }
}

applyAuthLanguage();
checkSession();
</script>
