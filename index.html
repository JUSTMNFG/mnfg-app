<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNFG App</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white;text-align:center}
header{padding:40px 20px;background:linear-gradient(135deg,#7c3aed,#db2777)}
h1{font-size:42px;margin:0}
p{color:#cbd5e1}
.box{background:#1e293b;margin:20px;padding:20px;border-radius:16px}
button{background:#7c3aed;color:white;border:none;padding:14px 20px;border-radius:12px;font-size:16px;width:100%;margin-top:10px}
button:active{transform:scale(.98)}
</style>
</head>
<body>
<header>
<h1>MNFG</h1>
<p>তোমার নিজের অ্যাপে স্বাগতম 🔥</p>
</header>
<div class="box">
<h2>স্বাগতম ভাই!</h2>
<p>MNFG App সফলভাবে চালু হইছে।</p>
<button onclick="alert('MNFG শুরু হইলো!')">শুরু করো 🚀</button>
<button onclick="alert('এইটা তোমার MNFG অ্যাপ')">আরো দেখো ✨</button>
</div>
<p style="font-size:12px;opacity:.6">Made by mridham944-hue</p>
  <div style="background:#1c1c1c;padding:15px;border-radius:15px;margin:15px;text-align:center;color:white">
<p>ভার্সন: <b id="myVer" style="color:#00e676">1.0</b></p>
<button onclick="checkUpdate()" style="background:#00e676;border:none;padding:12px;border-radius:10px;font-weight:bold;width:100%">আপডেট চেক করো</button>
<div id="updateBox" style="display:none;background:#ffca28;color:black;padding:12px;border-radius:10px;margin-top:10px">
<b>নতুন আপডেট আসছে! v1.1</b><br><br>
<button onclick="doUpdate()" style="background:black;color:white;padding:10px;border-radius:8px;width:100%">আপডেট দাও</button>
</div>
<p id="msg"></p>
</div>
<script>
let latestVersion="1.1"; let myVersion="1.0";
function checkUpdate(){
if(myVersion!==latestVersion){document.getElementById('updateBox').style.display='block';}
else{document.getElementById('msg').innerText='তুমি লেটেস্ট ভার্সনে আছো ✅';}
}
function doUpdate(){
document.getElementById('myVer').innerText=latestVersion; myVersion=latestVersion;
document.getElementById('updateBox').style.display='none';
document.getElementById('msg').innerText='আপডেট ডান! 🔥';
}
  </script>
</body>
</html>
