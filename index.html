<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bondhu Apps - Your Friend, With You</title>
<!-- এই ফন্টটাই ছবির মতন -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#1a002e;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:420px;min-height:100vh;background:linear-gradient(180deg,#4b0082 0%,#7b1fa2 35%,#d946a8 75%,#ff6eb4 100%);padding:45px 22px 20px;text-align:center;position:relative;overflow:hidden}
.logo{width:145px;height:145px;margin:10px auto 10px;background:radial-gradient(circle at 30% 30%,#ff7ad9,#7b1fa2 65%,#4b0082);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 15px 35px rgba(0,0,0,.35)}
.logo b{font-family:'Baloo 2',cursive;font-size:105px;color:#fff;font-style:italic;line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.2);transform:translateY(-5px)}
h1{color:#fff;font-size:36px;font-weight:800;letter-spacing:.5px}
p.tag{color:#fff;font-size:16px;margin-bottom:22px;opacity:.95}
.card{background:#fff;border-radius:22px;padding:22px 16px 20px;box-shadow:0 15px 30px rgba(0,0,0,.25)}
.input{width:100%;height:52px;border:1.5px solid #e8e8e8;border-radius:12px;padding:0 12px;font-size:16px;outline:none;margin-bottom:14px;background:#fff}
.input:focus{border-color:#9c27b0}
.row{display:flex;align-items:center;gap:8px}
.row span{font-size:18px}
.btn-login{width:100%;height:58px;border:none;border-radius:12px;background:linear-gradient(90deg,#4b0082,#e040a8);color:#fff;font-size:26px;font-weight:700;cursor:pointer}
.btn-create{width:100%;height:50px;border:none;border-radius:12px;background:#d1d1d1;color:#333;font-size:17px;font-weight:600;margin-top:14px;cursor:pointer}
.version{color:#5a2a5a;font-size:13px;margin-top:22px;font-weight:600}
#updateBox{display:none;background:#fff;color:#222;border-radius:14px;padding:14px;margin-bottom:14px;text-align:left}
#updateBox b{color:#d81b60}
#updateBox button{width:100%;height:44px;border:none;border-radius:10px;background:#25D366;color:#fff;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<div class="phone">
  <div class="logo"><b>B</b></div>
  <h1>Bondhu Apps</h1>
  <p class="tag">Your Friend, With You</p>

  <!-- আপডেট সিস্টেম -->
  <div id="updateBox">
    <b>🎉 নতুন আপডেট আসছে!</b><br>
    <span id="updateText">Version 1.2 পাওয়া গেছে। আপডেট দিলে নতুন ফিচার পাবা।</span>
    <button onclick="doUpdate()">এখন আপডেট করো</button>
  </div>

  <div class="card">
    <div class="row" style="border:1.5px solid #e8e8e8;border-radius:12px;padding:0 10px;margin-bottom:14px">
      <span>📞</span><span>+880</span>
      <input id="phone" class="input" style="border:none;margin:0;padding-left:2px" placeholder="1XXXXXXXXX" type="tel">
    </div>
    <div class="row" style="border:1.5px solid #e8e8e8;border-radius:12px;padding:0 10px;margin-bottom:16px">
      <span>🔒</span>
      <input id="pass" class="input" style="border:none;margin:0" placeholder="••••••••" type="password">
      <span onclick="showPass()" style="cursor:pointer">👁️</span>
    </div>
    <button class="btn-login" onclick="login()">Login</button>
    <button class="btn-create" onclick="createAcc()">Create New Account</button>
  </div>
  <div class="version" id="verText">Version 1.1 Trial</div>
</div>

<script>
// ===== আপডেট সিস্টেম =====
let CURRENT_VERSION = "1.1";
let LATEST_VERSION = "1.2"; // নতুন ভার্সন আসলে এখানে শুধু 1.3, 1.4 লিখবা
let UPDATE_LINK_ANDROID = "https://play.google.com/store"; // Android লিংক
let UPDATE_LINK_IPHONE = "https://apps.apple.com"; // iPhone লিংক

if(LATEST_VERSION !== CURRENT_VERSION){
  document.getElementById('updateBox').style.display='block';
  document.getElementById('updateText').innerText = "Version "+LATEST_VERSION+" পাওয়া গেছে। তুমি এখন "+CURRENT_VERSION+" ব্যবহার করতেছো।";
}
function doUpdate(){
  let isIphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isIphone){ window.open(UPDATE_LINK_IPHONE,'_blank'); }
  else { window.open(UPDATE_LINK_ANDROID,'_blank'); }
}
function showPass(){
  let p=document.getElementById('pass');
  p.type = p.type==='password'?'text':'password';
}
function login(){ alert("Login: +880 "+document.getElementById('phone').value); }
function createAcc(){ alert("Create New Account পেজে যাইতেছে..."); }
</script>
</body>
</html>
