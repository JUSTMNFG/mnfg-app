<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNFG - 100 Languages</title>
<style>
body{font-family:Arial;text-align:center;background:#f5f5f5;padding:15px}
body.dark{background:#111;color:white}
.card{background:white;padding:20px;border-radius:18px;max-width:430px;margin:auto;box-shadow:0 0 12px #ccc}
body.dark .card{background:#222;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.langBtn{padding:14px;font-size:16px;border:2px solid #ddd;border-radius:12px;background:#f9f9f9;cursor:pointer}
.langBtn:hover{background:#22c55e;color:white}
button{padding:12px 18px;background:#22c55e;color:white;border:none;border-radius:10px;font-size:16px;margin:5px}
.btn2{background:#2563eb}.btn3{background:#f97316}.btnGray{background:#6b7280}
input{padding:11px;font-size:16px;border-radius:10px;margin:8px;width:90%;border:1px solid #ddd}
.hidden{display:none}
.allLang{max-height:300px;overflow-y:auto;text-align:left}
.allLang button{width:100%;background:#f9f9f9;color:#111;border:1px solid #eee;text-align:left}
</style>
</head>
<body>
<div class="card">
<div id="langScreen">
<h2>Choose Your Language</h2>
<p>🌍 100 Languages Available</p>
<div class="grid">
<button class="langBtn" onclick="setLang('en','English')">🇬🇧 English</button>
<button class="langBtn" onclick="setLang('bn','বাংলা')">🇧🇩 বাংলা</button>
<button class="langBtn" onclick="setLang('ar','العربية')">🇸🇦 العربية</button>
<button class="langBtn" onclick="setLang('hi','हिन्दी')">🇮🇳 हिन्दी</button>
<button class="langBtn" onclick="setLang('zh','中文')">🇨🇳 中文</button>
<button class="langBtn" onclick="setLang('ja','日本語')">🇯🇵 日本語</button>
<button class="langBtn" onclick="setLang('fr','Français')">🇫🇷 Français</button>
<button class="langBtn" onclick="setLang('es','Español')">🇪🇸 Español</button>
</div>
<button class="btnGray" onclick="showAll()">See All 100 Languages 🔽</button>
<div id="allBox" class="hidden">
<input type="text" id="searchLang" placeholder="🔍 Search language..." onkeyup="filterLang()">
<div id="allList" class="allLang"></div>
</div>
</div>
<div id="mainApp" class="hidden">
<h1>MNFG</h1>
<h2 id="welcome">Welcome to MNFG App</h2>
<p id="curLang">Language: English</p>
<p id="version">Version: 1.1</p>
<button onclick="showSettings()">⚙️ Settings</button>
<button class="btn2" onclick="showAdmin()">🔐 Admin</button>
<button onclick="backLang()">🌍 Language</button>
<div id="settings" class="hidden">
<h3>⚙️ Settings</h3>
<p>🌙 Dark Mode: <button onclick="toggleDark()">ON / OFF</button></p>
<p>🔊 Sound: <button onclick="alert('Sound ON/OFF')">ON / OFF</button></p>
<button onclick="hideAll()">Close</button>
</div>
<div id="adminBox" class="hidden">
<h3>🔐 Admin Login</h3>
<input type="password" id="pass" placeholder="Enter Admin Password">
<br><button class="btn3" onclick="checkPass()">Login</button>
<p id="adminMsg"></p>
<div id="adminPanel" class="hidden"><p>✅ Welcome Admin!</p><button onclick="alert('Admin Panel Working')">Manage App</button></div>
</div>
<p id="desc">You are on latest version ✅</p>
<button id="btn" onclick="checkUpdate()">Check Update</button>
<p id="msg"></p>
</div>
</div>
