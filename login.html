
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MNfG</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 font-family:sans-serif;
 background:#f2f2f2;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
 margin:0;
 padding:15px
}

.box{
 background:white;
 padding:25px;
 border-radius:15px;
 width:100%;
 max-width:350px;
 box-shadow:0 5px 20px rgba(0,0,0,.1)
}

h2{text-align:center}

input{
 width:100%;
 padding:12px;
 margin:8px 0;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:16px
}

button{
 width:100%;
 padding:12px;
 background:black;
 color:white;
 border:none;
 border-radius:10px;
 font-size:16px;
 cursor:pointer;
 margin-top:10px
}

button.signup{background:#007bff}
button.secondary{background:#555}
button:disabled{opacity:.6;cursor:not-allowed}

.link{
 text-align:center;
 color:blue;
 margin-top:15px;
 cursor:pointer;
 font-size:14px
}

#msg{
 text-align:center;
 margin-top:12px;
 font-size:14px;
 min-height:20px;
 overflow-wrap:anywhere
}

.page{display:none}
#authBox{display:block}
</style>
</head>

<body>

<div class="box">

<h2>MNfG Login</h2>

<!-- LOGIN / SIGNUP -->
<div id="authBox" class="page">

<input type="email" id="email"
placeholder="ইমেইল দাও" autocomplete="email">

<input type="password" id="password"
placeholder="পাসওয়ার্ড দাও (৬+ অক্ষর)"
autocomplete="current-password">

<button id="loginBtn" onclick="doLogin()">
Login করো
</button>

<button class="signup" id="signupBtn" onclick="doSignup()">
নতুন একাউন্ট খুলো
</button>

<div class="link" onclick="showForgot()">
পাসওয়ার্ড ভুলে গেছো?
</div>

</div>

<!-- OTP VERIFICATION -->
<div id="otpBox" class="page">

<p style="text-align:center">
তোমার ইমেইলে ৬ সংখ্যার OTP গেছে।
কোডটি এখানে দাও।
</p>

<input type="text" id="otp"
placeholder="৬ সংখ্যার OTP"
maxlength="6"
inputmode="numeric"
autocomplete="one-time-code">

<button id="verifyBtn" onclick="verifyOtp()">
OTP দিয়ে কনফার্ম করো
</button>

<button class="secondary" id="resendBtn"
onclick="resendOtp()">
আবার OTP পাঠাও
</button>

<div class="link" onclick="backToLogin()">
পিছনে যাও
</div>

</div>

<!-- FORGOT PASSWORD -->
<div id="forgotBox" class="page">

<p style="text-align:center">
তোমার Account-এর ইমেইল দাও।
পাসওয়ার্ড পরিবর্তনের লিংক পাঠানো হবে।
</p>

<input type="email" id="forgotEmail"
placeholder="তোমার ইমেইল">

<button onclick="sendResetLink()">
Reset Link পাঠাও
</button>

<div class="link" onclick="backToLogin()">
Login-এ ফিরে যাও
</div>

</div>

<!-- NEW PASSWORD -->
<div id="resetBox" class="page">

<p style="text-align:center">
নতুন পাসওয়ার্ড সেট করো।
</p>

<input type="password" id="newPassword"
placeholder="নতুন পাসওয়ার্ড (৬+ অক্ষর)"
autocomplete="new-password">

<button onclick="updatePassword()">
নতুন পাসওয়ার্ড সংরক্ষণ করো
</button>

</div>

<div id="msg"></div>

</div>

<script>

// SUPABASE CONFIGURATION

const supabaseUrl =
"https://ujhjloihskutkazhaydc.supabase.co";

const supabaseKey =
"sb_publishable_EqE3D3fqYSf5C13Ds0wNyQ_ZeDHoJfH";

let supabaseClient = null;
let currentEmail = "";

// CLIENT INITIALIZATION

try{
 if(!window.supabase){
  throw new Error("Supabase Library লোড হয়নি");
 }

 supabaseClient = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
 );

}catch(error){
 console.error(error);
 showMessage("Supabase সংযোগ তৈরি হয়নি!", "red");
}

// PAGE CONTROL

function showPage(pageId){
 document.querySelectorAll(".page").forEach(page=>{
  page.style.display="none";
 });

 document.getElementById(pageId).style.display="block";
}

function showMessage(message,color="black"){
 const msg=document.getElementById("msg");
 msg.innerText=message;
 msg.style.color=color;
}

function setLoading(buttonId,loading,text){
 const button=document.getElementById(buttonId);
 button.disabled=loading;
 if(loading){
  button.dataset.oldText=button.innerText;
  button.innerText=text;
 }else if(button.dataset.oldText){
  button.innerText=button.dataset.oldText;
 }
}

function validEmail(email){
 return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function checkClient(){
 if(!supabaseClient){
  showMessage("Supabase সংযোগ পাওয়া যায়নি!","red");
  return false;
 }
 return true;
}

// SIGNUP

async function doSignup(){

 if(!checkClient()) return;

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!validEmail(email)){
  showMessage("সঠিক ইমেইল দাও","red");
  return;
 }

 if(password.length<6){
  showMessage("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দাও","red");
  return;
 }

 currentEmail=email;

 setLoading("signupBtn",true,"Account তৈরি হচ্ছে...");
 showMessage("OTP পাঠানো হচ্ছে...");

 try{

  const {data,error}=await supabaseClient.auth.signUp({
   email,
   password
  });

  if(error) throw error;

  if(data.session){
   showMessage("Account তৈরি হয়েছে!","green");
   window.location.replace("index.html");
   return;
  }

  showMessage("OTP পাঠানো হয়েছে! ইমেইল চেক করো।","green");
  document.getElementById("otp").value="";
  showPage("otpBox");

 }catch(error){
  showMessage(error.message,"red");
 }finally{
  setLoading("signupBtn",false);
 }

}

// LOGIN

async function doLogin(){

 if(!checkClient()) return;

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!validEmail(email)||password.length<6){
  showMessage("ইমেইল ও পাসওয়ার্ড ঠিক করে দাও","red");
  return;
 }

 setLoading("loginBtn",true,"Login হচ্ছে...");
 showMessage("অপেক্ষা করো...");

 try{

  const {data,error}=await supabaseClient.auth.signInWithPassword({
   email,
   password
  });

  if(error) throw error;

  if(data.session){
   showMessage("Login সফল হয়েছে!","green");
   window.location.replace("index.html");
  }

 }catch(error){
  showMessage("Login হয়নি: "+error.message,"red");
 }finally{
  setLoading("loginBtn",false);
 }

}

// VERIFY OTP

async function verifyOtp(){

 if(!checkClient()) return;

 const token=document.getElementById("otp").value.trim();

 if(!currentEmail){
  showMessage("ইমেইল পাওয়া যায়নি। আবার Signup করো।","red");
  return;
 }

 if(!/^\d{6}$/.test(token)){
  showMessage("সঠিক ৬ সংখ্যার OTP দাও","red");
  return;
 }

 setLoading("verifyBtn",true,"যাচাই হচ্ছে...");

 try{

  const {data,error}=await supabaseClient.auth.verifyOtp({
   email:currentEmail,
   token:token,
   type:"signup"
  });

  if(error) throw error;

  if(data.session){
   showMessage("Account Verify সফল হয়েছে!","green");
   window.location.replace("index.html");
  }else{
   showMessage("Verify হয়েছে। এখন Login করো।","green");
   backToLogin();
  }

 }catch(error){
  showMessage("OTP ভুল অথবা মেয়াদ শেষ: "+error.message,"red");
 }finally{
  setLoading("verifyBtn",false);
 }

}

// RESEND OTP

async function resendOtp(){

 if(!checkClient()) return;

 if(!currentEmail){
  showMessage("ইমেইল পাওয়া যায়নি","red");
  return;
 }

 setLoading("resendBtn",true,"OTP পাঠানো হচ্ছে...");

 try{

  const {error}=await supabaseClient.auth.resend({
   type:"signup",
   email:currentEmail
  });

  if(error) throw error;

  showMessage("নতুন OTP পাঠানো হয়েছে!","green");

 }catch(error){
  showMessage(error.message,"red");
 }finally{
  setLoading("resendBtn",false);
 }

}

// BACK TO LOGIN

function backToLogin(){
 showPage("authBox");
 showMessage("");
}

// FORGOT PASSWORD

function showForgot(){
 const email=document.getElementById("email").value.trim();
 document.getElementById("forgotEmail").value=email;
 showPage("forgotBox");
 showMessage("");
}

async function sendResetLink(){

 if(!checkClient()) return;

 const email=document.getElementById("forgotEmail").value.trim();

 if(!validEmail(email)){
  showMessage("সঠিক ইমেইল দাও","red");
  return;
 }

 showMessage("Reset Link পাঠানো হচ্ছে...");

 try{

  const {error}=await supabaseClient.auth.resetPasswordForEmail(
   email,
   {
    redirectTo:window.location.origin+
    window.location.pathname
   }
  );

  if(error) throw error;

  showMessage("যদি Account থাকে, Reset Link ইমেইলে পাঠানো হয়েছে।","green");

 }catch(error){
  showMessage(error.message,"red");
 }

}

// PASSWORD RECOVERY

async function updatePassword(){

 if(!checkClient()) return;

 const password=document.getElementById("newPassword").value;

 if(password.length<6){
  showMessage("নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দাও","red");
  return;
 }

 showMessage("পাসওয়ার্ড পরিবর্তন হচ্ছে...");

 try{

  const {data,error}=await supabaseClient.auth.updateUser({
   password:password
  });

  if(error) throw error;

  showMessage("পাসওয়ার্ড পরিবর্তন সফল হয়েছে!","green");

  window.location.replace("index.html");

 }catch(error){
  showMessage(error.message,"red");
 }

}

// AUTH STATE LISTENER

if(supabaseClient){

 supabaseClient.auth.onAuthStateChange((event,session)=>{

  if(event==="PASSWORD_RECOVERY"){
   showPage("resetBox");
   showMessage("নতুন পাসওয়ার্ড সেট করো।","green");
  }

 });

}

// INITIAL PAGE

showPage("authBox");

</script>

</body>
</html>
